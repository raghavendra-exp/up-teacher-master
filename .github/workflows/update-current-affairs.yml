name: Daily Current Affairs & Notification Updater

on:
  schedule:
    # Runs daily at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh all sources immediately'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fetcher Dependencies
        run: |
          pip install requests urllib3

      - name: Fetch and Normalize Educational Feeds
        run: |
          python scripts/fetch_current_affairs.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Current Affairs Updater]"
          git add src/data/
          if git diff-index --quiet HEAD; then
            echo "No new updates detected today."
          else
            git commit -m "chore(auto): daily update for current affairs & notification feeds [skip ci]"
            git push
          fi
